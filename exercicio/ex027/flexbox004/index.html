<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>
        #conteiner {
            display: flex;
            background-color: antiquewhite;

            flex-flow: row-reverse wrap-reverse;

            
        }

        .itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;

        }
    </style>
</head>
<body> 
    <h1>flex-flow</h1>

    <p>O flex-flow é a junção do flex-direction+flex-wrap</p>

    <div id="conteiner">

        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
        <div class="itens">J</div>

    </div>
</body>
</html>
