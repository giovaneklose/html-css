<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>

        /*

        Flex-Basis
        O basis servi para determinar u, tamanho fixo de um item, mas nunca será fixo porque o flex sempre tenatra adaptar o tamanho

        */

        #conteiner {
            display: flex;

            background-color: antiquewhite;
        }

        .itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;

            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div id="conteiner">

        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
       

    </div>
</body>
</html>
