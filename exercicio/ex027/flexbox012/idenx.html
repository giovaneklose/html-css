<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>

        /*

        Flex
        O flex é um shorthand do basis, grow e shrink que a sequencia correta é;

        fle: grow + shrink + basis

        */


        #conteiner {
            display: flex;

            background-color: antiquewhite;
        }

        #itens1 {
            background-color: blue;
            border: 1px solid black;
            text-align: center;

            flex: 1 1 auto;
        }

        #itens2 {
            background-color: blue;
            border: 1px solid black;
            text-align: center;

            flex: 0 0 200px;
        }

        #itens3 {
            background-color: blue;
            border: 1px solid black;
            text-align: center;

            flex: none;
        }
    </style>
</head> 
<body>

    <h1>Flex</h1>

    <div id="conteiner">

        <div id="itens1">A</div>
        <div id="itens2">B</div>
        <div id="itens3">C</div>
       
    </div>
</body>
</html>
