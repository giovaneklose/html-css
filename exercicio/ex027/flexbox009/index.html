<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>

        /*
        Posicionando itens

        Para posicionar usaremos o align-self com os atributos auto, flex-start, flex-end, center e stretch 
        */
        #conteiner {
            display: flex;

            background-color: antiquewhite;
            flex-flow: row wrap;

            align-items: flex-start;
            

            height: 400px;

        }

        .itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;

            padding: 20px;
        }

        #a {
            align-self: auto;
        }

        #b {
            align-self: flex-start;
        }

        #c {
            align-self: flex-end;
        }

        #d {
            align-self: center;
        }

        #e {
            align-self: stretch;
        }
    </style>
</head>
<body>
    <div id="conteiner">

        <div class="itens" id="a">A</div>
        <div class="itens" id="b">B</div>
        <div class="itens" id="c">C</div>
        <div class="itens" id="d">D</div>
        <div class="itens" id="e">E</div>
        <div class="itens" id="f">F</div>
        <div class="itens" id="g">G</div>
        <div class="itens" id="h">H</div>
        <div class="itens" id="i">I</div>
        

    </div>
</body>
</html>
