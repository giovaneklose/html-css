<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iem">Email:</label>
            <input type="email" name="ema" id="ima" required autocomplete="email">
        </p>

        <p>
            <label for="itel">Telelefone:</label>
            <input type="tel" name="tel" id="itel" required autocomplete="tel-national" minlength="2">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limapar">
        </p>

    </form>
</body>
</html>
