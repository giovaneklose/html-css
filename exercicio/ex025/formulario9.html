<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario com JavaScript</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="1nu">Numero1:</label>
            <input type="number" name="1nu" id="i1nu" oninput="isoma.innerHTML = Number(i1nu.value) + Number(i2nu.value)">
        </p>

        <p>
            <label for="2nu">Numero2:</label>
            <input type="number" name="2nu" id="i2nu" oninput="isoma.innerHTML = Number(i1nu.value) + Number(i2nu.value)">
        </p>

        <p>
            <label for="isoma">Soma</label>
            <output name="isoma" id="isoma">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
