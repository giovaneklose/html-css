<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="icor">Eolha uma cor</label>
            <input type="color" name="cor" id="icor" value="#000">
        </p>
        <p>
            <label for="inivel">Qual o nivel</label>
            <input type="range" name="nivel" id="inivel" value="10">
        </p>
        <p>
            <label for="ifile">Anexe uma foto</label>
            <input type="file" name="file" id="ifile">
        </p>
    </form>
</body>
</html>
