<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="inum">Numero:</label>
            <input type="number" name="num" id="inum" autocomplete="cc-number" min="1" max="10" step="0.1" value="5" required>
        </p>

        <p>
            <label for="imes">Mes</label>
            <input type="month" name="mes" id="imes" autocomplete="cc-exp-month" required>
        </p>

        <p>
            <label for="idat">Data</label>
            <input type="date" name="dat" id="idat" autocomplete="bday-day" required>
        </p>
        
        <p>
            <label for="ihor">Hora</label>
            <input type="time" name="hor" id="ihor" required>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
