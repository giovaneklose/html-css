<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        /*
        Simplificando propriedade
        place-itens
        place-content
        grid-template
        */
        div.container {
            border: 3px solid black;
            height: 500px;

            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto);
            gap: 5px;
            place-items: center center;
            place-content: space-envely space-around;
        }

        .itens {
            border: 3px solid greenyellow;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">B</div>
        <div class="itens">C</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">F</div>
        <div class="itens">G</div>
        <div class="itens">H</div>
        <div class="itens">I</div>
    </div>
</body>
</html>
